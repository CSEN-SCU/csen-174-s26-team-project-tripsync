<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Kanban sprint board evidence</title>
  <desc id="desc">A reconstructed artifact from the supplied Orbit Kanban screenshot showing backlog, to do, in progress, and done columns with representative sprint cards.</desc>
  <rect width="1200" height="675" fill="#0d1117"/>
