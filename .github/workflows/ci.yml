name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dart dependencies
        run: dart pub get
        working-directory: tests

      - name: Run Dart test suite
        run: dart test .
        working-directory: tests
        env:
          ORBIT_LLM_API_KEY: ${{ secrets.ORBIT_LLM_API_KEY }}
          ORBIT_LLM_MODEL: ${{ secrets.ORBIT_LLM_MODEL }}
          ORBIT_LLM_BASE_URL: ${{ secrets.ORBIT_LLM_BASE_URL }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install
        working-directory: geo-poi-database

      - name: Run Node integration test suite
        run: npm test
        working-directory: geo-poi-database
        env:
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Write Firebase native config (for Flutter builds)
        if: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
        run: bash scripts/write_firebase_native_config.sh
        working-directory: app
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_ANDROID_OAUTH_CLIENT_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_CLIENT_ID: ${{ secrets.FIREBASE_IOS_CLIENT_ID }}
